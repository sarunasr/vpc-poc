apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-opentofu-git
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  deploymentTemplate:
    spec:
      selector:
        matchLabels:
          pkg.crossplane.io/provider: provider-opentofu
          pkg.crossplane.io/revision: provider-opentofu-605ba57f9504
      template:
        spec:
          securityContext:
            fsGroup: 2000
          volumes:
            - name: provider-opentofu-git-secret
              secret:
                secretName: provider-opentofu-git-auth
                defaultMode: 288
            - name: provider-opentofu-git-auth
              emptyDir: {}
            - name: provider-opentofu-ssh-tools
              emptyDir: {}
          initContainers:
            - name: install-openssh-client
              image: alpine:3.21.3
              command:
                - /bin/sh
                - -ec
              args:
                - >-
                  apk add --no-cache --root /tools --initdb
                  --repositories-file /etc/apk/repositories
                  --keys-dir /etc/apk/keys openssh-client-default;
                  test -x /tools/usr/bin/ssh;
                  cp /source/id_ed25519 /auth/id_ed25519;
                  cp /source/known_hosts /auth/known_hosts;
                  chown 2000:2000 /auth/id_ed25519 /auth/known_hosts;
                  chmod 600 /auth/id_ed25519;
                  chmod 644 /auth/known_hosts
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
                runAsNonRoot: false
                runAsUser: 0
              volumeMounts:
                - name: provider-opentofu-ssh-tools
                  mountPath: /tools
                - name: provider-opentofu-git-secret
                  mountPath: /source
                  readOnly: true
                - name: provider-opentofu-git-auth
                  mountPath: /auth
          containers:
            - name: package-runtime
              env:
                - name: GIT_SSH_COMMAND
                  value: >-
                    LD_LIBRARY_PATH=/var/run/provider-opentofu-ssh-tools/usr/lib:/var/run/provider-opentofu-ssh-tools/lib
                    /var/run/provider-opentofu-ssh-tools/usr/bin/ssh
                    -i /var/run/provider-opentofu-git-auth/id_ed25519
                    -o IdentitiesOnly=yes
                    -o StrictHostKeyChecking=yes
                    -o UserKnownHostsFile=/var/run/provider-opentofu-git-auth/known_hosts
              volumeMounts:
                - name: provider-opentofu-git-auth
                  mountPath: /var/run/provider-opentofu-git-auth
                  readOnly: true
                - name: provider-opentofu-ssh-tools
                  mountPath: /var/run/provider-opentofu-ssh-tools
                  readOnly: true
