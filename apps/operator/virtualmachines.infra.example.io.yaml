apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: virtualmachines.infra.example.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    plural: virtualmachines
    singular: virtualmachine
    kind: VirtualMachine
    shortNames:
      - vm
    categories:
      - all
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Datacenter
          type: string
          jsonPath: .spec.datacenterRef
        - name: Infra
          type: string
          jsonPath: .status.conditions[?(@.type=="InfrastructureReady")].status
        - name: Config
          type: string
          jsonPath: .status.conditions[?(@.type=="ConfigurationSynced")].status
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - datacenterRef
                - vm
                - ansible
              properties:
                datacenterRef:
                  type: string
                  minLength: 1
                vm:
                  type: object
                  required:
                    - vm_id
                    - ipv4_cidr
                  properties:
                    name:
                      type: string
                    vm_id:
                      type: integer
                      minimum: 1
                    node_name:
                      type: string
                    template_id:
                      type: integer
                      minimum: 1
                    cores:
                      type: integer
                      minimum: 1
                    memory_mb:
                      type: integer
                      minimum: 1
                    disk_size_gb:
                      type: integer
                      minimum: 1
                    bridge:
                      type: string
                    ipv4_cidr:
                      type: string
                      pattern: "^[0-9.]+/[0-9]+$"
                    gateway:
                      type: string
                    dns_servers:
                      type: array
                      items:
                        type: string
                    cloud_init_user:
                      type: string
                target:
                  type: object
                  properties:
                    host:
                      type: string
                    user:
                      type: string
                    sshSecretRef:
                      type: string
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    proxyJump:
                      type: object
                      required:
                        - host
                        - user
                        - sshSecretRef
                      properties:
                        host:
                          type: string
                          pattern: "^[A-Za-z0-9][A-Za-z0-9.:-]*$"
                        user:
                          type: string
                          pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"
                        sshSecretRef:
                          type: string
                          pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                ansible:
                  type: object
                  required:
                    - collections
                    - roles
                  properties:
                    collections:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - version
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9_]+\\.[a-z0-9_]+$"
                          version:
                            type: string
                            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([+-][A-Za-z0-9.-]+)?$"
                    roles:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9_]+\\.[a-z0-9_]+\\.[a-z0-9_]+$"
                          vars:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    lifecycle:
                      type: object
                      properties:
                        uninstallRemovedRoles:
                          type: boolean
                reconciliation:
                  type: object
                  properties:
                    onChange:
                      type: boolean
                    schedule:
                      type: object
                      required:
                        - type
                      properties:
                        type:
                          type: string
                          enum:
                            - interval
                            - cron
                        duration:
                          type: string
                        expression:
                          type: string
                        timezone:
                          type: string
                execution:
                  type: object
                  properties:
                    maxConcurrent:
                      type: integer
                      minimum: 1
                      maximum: 100
                    timeout:
                      type: string
                    maxRetries:
                      type: integer
                      minimum: 0
                      maximum: 10
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
