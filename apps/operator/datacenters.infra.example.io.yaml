apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datacenters.infra.example.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    plural: datacenters
    singular: datacenter
    kind: Datacenter
    shortNames:
      - dc
    categories:
      - all
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Workspace
          type: string
          jsonPath: .spec.terraform.workspaceName
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - terraform
              properties:
                terraform:
                  type: object
                  required:
                    - workspaceName
                    - module
                    - proxmoxAPIToken
                    - sshPublicKeys
                  properties:
                    workspaceName:
                      type: string
                      minLength: 1
                    module:
                      type: object
                      required:
                        - source
                        - version
                      properties:
                        source:
                          type: string
                          minLength: 1
                        version:
                          type: string
                          pattern: "^(?:[0-9a-f]{40}|v?[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?)$"
                        entrypoint:
                          type: string
                    providerConfigRef:
                      type: object
                      required:
                        - name
                      properties:
                        kind:
                          type: string
                          enum:
                            - ProviderConfig
                            - ClusterProviderConfig
                        name:
                          type: string
                          minLength: 1
                    proxmoxAPIToken:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          type: string
                          minLength: 1
                    sshPublicKeys:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                          minLength: 1
                        key:
                          type: string
                          minLength: 1
                proxmox:
                  type: object
                  properties:
                    defaultNode:
                      type: string
                    defaultTemplate:
                      type: integer
                      minimum: 1
                vmDefaults:
                  type: object
                  properties:
                    cores:
                      type: integer
                      minimum: 1
                    memory_mb:
                      type: integer
                      minimum: 1
                    disk_size_gb:
                      type: integer
                      minimum: 1
                    bridge:
                      type: string
                    gateway:
                      type: string
                    dns_servers:
                      type: array
                      items:
                        type: string
                    cloud_init_user:
                      type: string
                ansible:
                  type: object
                  properties:
                    defaults:
                      type: object
                      properties:
                        user:
                          type: string
                        sshSecretRef:
                          type: string
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        proxyJump:
                          type: object
                          required:
                            - host
                            - user
                            - sshSecretRef
                          properties:
                            host:
                              type: string
                              pattern: "^[A-Za-z0-9][A-Za-z0-9.:-]*$"
                            user:
                              type: string
                              pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"
                            sshSecretRef:
                              type: string
                              pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                            port:
                              type: integer
                              minimum: 1
                              maximum: 65535
                    reconciliation:
                      type: object
                      properties:
                        onChange:
                          type: boolean
                        schedule:
                          type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              enum:
                                - interval
                                - cron
                            duration:
                              type: string
                            expression:
                              type: string
                            timezone:
                              type: string
                    execution:
                      type: object
                      properties:
                        maxConcurrent:
                          type: integer
                          minimum: 1
                          maximum: 100
                        timeout:
                          type: string
                        maxRetries:
                          type: integer
                          minimum: 0
                          maximum: 10
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
