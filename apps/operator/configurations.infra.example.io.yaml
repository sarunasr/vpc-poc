apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configurations.infra.example.io
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    plural: configurations
    singular: configuration
    kind: Configuration
    shortNames:
      - cfg
    categories:
      - all
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Desired
          type: string
          jsonPath: .status.desiredRevision
        - name: Applied
          type: string
          jsonPath: .status.appliedRevision
        - name: Config
          type: string
          jsonPath: .status.conditions[?(@.type=="ConfigurationSynced")].status
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - target
                - ansible
              properties:
                target:
                  type: object
                  required:
                    - host
                    - user
                    - sshSecretRef
                  properties:
                    host:
                      type: string
                      minLength: 1
                    user:
                      type: string
                      minLength: 1
                    sshSecretRef:
                      type: string
                      minLength: 1
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                infrastructureRef:
                  type: object
                  required:
                    - workspaceName
                  properties:
                    workspaceName:
                      type: string
                      minLength: 1
                ansible:
                  type: object
                  required:
                    - collections
                    - roles
                  properties:
                    collections:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - version
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9_]+\\.[a-z0-9_]+$"
                          version:
                            type: string
                            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([+-][A-Za-z0-9.-]+)?$"
                    roles:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9_]+\\.[a-z0-9_]+\\.[a-z0-9_]+$"
                          vars:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    lifecycle:
                      type: object
                      properties:
                        uninstallRemovedRoles:
                          type: boolean
                reconciliation:
                  type: object
                  properties:
                    onChange:
                      type: boolean
                    schedule:
                      type: object
                      required:
                        - type
                      properties:
                        type:
                          type: string
                          enum:
                            - interval
                            - cron
                        duration:
                          type: string
                        expression:
                          type: string
                        timezone:
                          type: string
                execution:
                  type: object
                  properties:
                    maxConcurrent:
                      type: integer
                      minimum: 1
                      maximum: 100
                    timeout:
                      type: string
                    maxRetries:
                      type: integer
                      minimum: 0
                      maximum: 10
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: configuration-controller
  namespace: infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configuration-controller
  namespace: infrastructure
rules:
  - apiGroups:
      - infra.example.io
    resources:
      - configurations
      - configurations/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
  - apiGroups:
      - opentofu.m.upbound.io
    resources:
      - workspaces
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configuration-controller
  namespace: infrastructure
subjects:
  - kind: ServiceAccount
    name: configuration-controller
    namespace: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configuration-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-controller
  namespace: infrastructure
  labels:
    app.kubernetes.io/name: configuration-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: configuration-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configuration-controller
    spec:
      serviceAccountName: configuration-controller
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/sarunasr/vpc-poc-operator:1.0.1
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
            - --metrics-secure=false
            - --collection-versions=homelab.web=1.0.0,homelab.system=1.0.0
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Vilnius
