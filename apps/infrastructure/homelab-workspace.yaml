apiVersion: opentofu.m.upbound.io/v1beta1
kind: Workspace
metadata:
  name: homelab
  namespace: infrastructure
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  managementPolicies:
    - Observe
  forProvider:
    source: Remote
    module: git::ssh://git@github.com/sarunasr/vpc-poc.git?ref=fc825e888e4ca9dd45bdb54c13759e6c3e65606f
    entrypoint: terraform/environments/homelab
    remotePullPolicy: Always
    env:
      - name: TF_VAR_proxmox_api_token
        secretKeyRef:
          name: proxmox-credentials
          key: api-token
      - name: TF_VAR_ssh_public_keys
        secretKeyRef:
          name: homelab-vm-ssh
          key: ssh-public-keys
