apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: provider-opentofu
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@github.com/sarunasr/vpc-poc.git
    targetRevision: main
    path: crossplane/provider
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
