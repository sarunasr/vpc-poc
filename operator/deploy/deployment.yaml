apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-controller
  namespace: infrastructure
  labels:
    app.kubernetes.io/name: configuration-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: configuration-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: configuration-controller
    spec:
      serviceAccountName: configuration-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/sarunasr/vpc-poc-operator:1.0.5
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=0
            - --health-probe-bind-address=:8081
            - --metrics-secure=false
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: Europe/Vilnius
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ansible-ee-versions
  namespace: infrastructure
data:
  homelab.web: "1.0.0"
  homelab.system: "1.0.0"
