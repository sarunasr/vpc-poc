apiVersion: v1
kind: ServiceAccount
metadata:
  name: configuration-controller
  namespace: infrastructure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configuration-controller
  namespace: infrastructure
rules:
  - apiGroups:
      - infra.example.io
    resources:
      - configurations
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - infra.example.io
    resources:
      - configurations/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - delete
      - get
  - apiGroups:
      - opentofu.m.upbound.io
    resources:
      - workspaces
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configuration-controller
  namespace: infrastructure
subjects:
  - kind: ServiceAccount
    name: configuration-controller
    namespace: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configuration-controller
