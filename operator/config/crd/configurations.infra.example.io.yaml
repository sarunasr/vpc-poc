apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: configurations.infra.example.io
spec:
  group: infra.example.io
  scope: Namespaced
  names:
    plural: configurations
    singular: configuration
    kind: Configuration
    shortNames:
      - cfg
    categories:
      - all
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Desired
          type: string
          jsonPath: .status.desiredRevision
        - name: Applied
          type: string
          jsonPath: .status.appliedRevision
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="ConfigurationSynced")].status
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - target
                - ansible
              properties:
                target:
                  type: object
                  required:
                    - host
                    - user
                    - sshSecretRef
                  properties:
                    host:
                      type: string
                      minLength: 1
                    user:
                      type: string
                      minLength: 1
                    sshSecretRef:
                      type: string
                      minLength: 1
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                infrastructureRef:
                  type: object
                  required:
                    - workspaceName
                  properties:
                    workspaceName:
                      type: string
                      minLength: 1
                ansible:
                  type: object
                  required:
                    - collections
                    - roles
                  properties:
                    collections:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                          - version
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9_]+\\.[a-z0-9_]+$"
                          version:
                            type: string
                            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([+-][A-Za-z0-9.-]+)?$"
                    roles:
                      type: array
                      items:
                        type: object
                        required:
                          - name
                        properties:
                          name:
                            type: string
                            pattern: "^[a-z0-9_]+\\.[a-z0-9_]+\\.[a-z0-9_]+$"
                          vars:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                    lifecycle:
                      type: object
                      properties:
                        uninstallRemovedRoles:
                          type: boolean
                reconciliation:
                  type: object
                  properties:
                    onChange:
                      type: boolean
                    schedule:
                      type: object
                      required:
                        - type
                      properties:
                        type:
                          type: string
                          enum:
                            - interval
                            - cron
                        duration:
                          type: string
                        expression:
                          type: string
                        timezone:
                          type: string
                execution:
                  type: object
                  properties:
                    maxConcurrent:
                      type: integer
                      minimum: 1
                      maximum: 100
                    timeout:
                      type: string
                    maxRetries:
                      type: integer
                      minimum: 0
                      maximum: 10
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
