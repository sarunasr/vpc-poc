---
- name: Install and configure Nginx
  when: nginx_state == 'present'
  block:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Deploy the POC landing page
      ansible.builtin.copy:
        content: "{{ nginx_page_content }}\n"
        dest: "{{ nginx_web_root }}/index.html"
        owner: root
        group: root
        mode: "0644"
      notify: Restart Nginx

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

- name: Remove Nginx and only the role-managed page
  when: nginx_state == 'absent'
  block:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Stop and disable Nginx when installed
      ansible.builtin.service:
        name: nginx
        enabled: false
        state: stopped
      when: "'nginx.service' in ansible_facts.services"

    - name: Remove the role-managed landing page
      ansible.builtin.file:
        path: "{{ nginx_web_root }}/index.html"
        state: absent

    - name: Remove Nginx package without removing shared dependencies
      ansible.builtin.apt:
        name: nginx
        state: absent
        purge: true
        autoremove: false
