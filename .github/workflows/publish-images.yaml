name: Publish POC images

on:
  push:
    branches:
      - main
    tags:
      - v1.0.1

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/tags/v1.0.1'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Ansible collections
        run: |
          python -m pip install --disable-pip-version-check "ansible-core==2.18.6"
          make collections-build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: operator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vpc-poc-operator:1.0.1

      - name: Publish Ansible execution image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ansible/ee/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vpc-poc-ansible-ee:1.0.1

  set-private-visibility:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Set both GHCR packages to private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/vpc-poc-operator/visibility \
            -f visibility=private
          gh api --method PATCH /user/packages/container/vpc-poc-ansible-ee/visibility \
            -f visibility=private
